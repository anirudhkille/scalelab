<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10141b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="ScaleLab" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ScaleLab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="author" content="Anirudh Kille" />

    <meta property="og:title" content="ScaleLab — System Design Stress-Testing Playground" />
    <meta
      property="og:description"
      content="Build a system architecture, hit it with simulated traffic and injected failures, then learn exactly which component breaks first."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ScaleLab" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://scalelab.anirudhkille.com/" />
    <meta property="og:image" content="https://scalelab.anirudhkille.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ScaleLab social card with the wordmark and a node graph showing clients, load balancer, app server, cache, and database."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ScaleLab — System Design Stress-Testing Playground" />
    <meta
      name="twitter:description"
      content="Build a system architecture, hit it with simulated traffic and injected failures, then learn exactly which component breaks first."
    />
    <meta name="twitter:image" content="https://scalelab.anirudhkille.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="ScaleLab social card with the wordmark and a node graph showing clients, load balancer, app server, cache, and database."
    />

    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        var theme = null;
        try {
          var stored = JSON.parse(localStorage.getItem("scalelab:v1") || "null");
          if (stored && stored.state && stored.state.settings) {
            theme = stored.state.settings.theme;
          }
        } catch {
          /* start fresh */
        }
        if (
          theme !== "midnight" &&
          theme !== "violet" &&
          theme !== "terminal" &&
          theme !== "paper"
        ) {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "midnight";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme !== "paper");
        document.documentElement.style.colorScheme = theme === "paper" ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
